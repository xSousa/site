```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Necrovenum - Test News</title>

    <style>

        body {
            background: #111;
            color: #ddd;
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        .box {
            max-width: 600px;
            margin: auto;
            background: #1c1c1c;
            padding: 25px;
            border: 1px solid #444;
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input,
        textarea {
            width: 100%;
            box-sizing: border-box;
            background: #111;
            color: white;
            border: 1px solid #555;
            padding: 10px;
        }

        textarea {
            height: 150px;
            resize: vertical;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            background: #333;
            color: white;
            border: 1px solid #666;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        #status {
            margin-top: 20px;
        }

    </style>

</head>

<body>

<div class="box">

    <h1>Test News</h1>

    <form id="news-form">

        <label for="title">
            Title
        </label>

        <input
            type="text"
            id="title"
            placeholder="News title"
            required
        >

        <label for="text">
            Text
        </label>

        <textarea
            id="text"
            placeholder="News text..."
            required
        ></textarea>

        <button type="submit">
            Publish Test News
        </button>

    </form>

    <div id="status"></div>

</div>


<script type="module">

    import { db } from "./firebase.js";

    import {
        collection,
        addDoc,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


    const form = document.getElementById("news-form");
    const status = document.getElementById("status");


    form.addEventListener("submit", async (event) => {

        event.preventDefault();

        const title = document.getElementById("title").value;
        const text = document.getElementById("text").value;


        status.textContent = "Publishing...";


        try {

            await addDoc(collection(db, "news"), {

                title: title,
                text: text,
                date: serverTimestamp()

            });


            status.textContent = "News published successfully!";

            form.reset();


        } catch (error) {

            console.error(error);

            status.textContent =
                "Error publishing news: " + error.message;

        }

    });

</script>

</body>

</html>
