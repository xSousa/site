<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<style>

html,body{

    margin:0;
    padding:0;

    background:#000;
    color:#CFCFCF;

    font-family:Verdana, Arial, sans-serif;
    font-size:12px;

}

/* Fundo */

body{

    background:#000;

    color:#FFF;

    font-family:Verdana, Arial, sans-serif;
    font-size:12px;

    font-style:italic;
    font-weight:bold;

}

/* Estrutura */

.wrapper{

    width:800px;

    margin:0 auto;

    display:flex;

    min-height:100vh;

}

/* Barras laterais */

.side{

    width:16px;

    background-image:url("../images/structure/sides.png");
    background-repeat:repeat-y;
    background-position:center top;

}

/* Conteúdo */

.content{

    flex:1;

    background:#000;

    padding:25px;

}

h2{

    color:#999;
    font-weight:normal;
    letter-spacing:3px;

}

hr{

    border:0;
    border-top:1px solid #333;

}

p{

    line-height:22px;

}

</style>

</head>

<body>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<link rel="stylesheet" href="../style.css">

</head>

<body class="page-body">

<div class="wrapper">

    <div class="side"></div>

    <div class="page-content">

        <h2 class="page-title">WELCOME</h2>

        <hr>

        <p class="page-text">

            Welcome to the official website of Necrovenum.
            <br><br>

            This website is currently under construction.
            <br><br>

            Soon you'll find news, lyrics, discography and more.

        </p>

    </div>

    <div class="side"></div>

</div>

</body>
</html>
